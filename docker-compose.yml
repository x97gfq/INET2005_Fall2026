services:
  web:
    build: .
    container_name: inet-lamp-web
    ports:
      - "80:80"
    volumes:
      - ./www:/var/www/html
      - ./cgi-bin:/usr/lib/cgi-bin
      - ./cgi-src:/usr/src/cgi
    depends_on:
      - db

  db:
    image: mysql:8.4
    container_name: inet-lamp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: inet-lamp-pma
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  mysql_data:
