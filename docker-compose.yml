services:
  web:
    build: .
    container_name: inet-lamp-web
    ports:
      - "80:80"
    volumes:
      - ./www:/var/www/html
      - ./cgi-bin:/usr/lib/cgi-bin
      - ./cgi-src:/usr/src/cgi
    depends_on:
      - db

  db:
    image: mysql:8.4
    container_name: inet-lamp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: inet-lamp-pma
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

  # Node.js server: code lives in ./nodejs
  #   http://localhost:3000  landing page (nodejs/server.js)
  #   http://localhost:3001  whichever example you run with
  #                          docker compose exec node node week04/class1/01_hello_http.js
  node:
    image: node:22-alpine
    container_name: inet-node
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_DATABASE: appdb
      MONGO_URL: mongodb://mongo:27017
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./nodejs:/app
      # keep the container's node_modules separate from any you install on Windows
      - node_modules:/app/node_modules
    depends_on:
      - db
      - mongo

  # MongoDB: connect from Compass / VS Code with mongodb://localhost:27017
  # No username or password - local development only.
  mongo:
    image: mongo:8.0
    container_name: inet-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
  mongo_data:
  node_modules:
