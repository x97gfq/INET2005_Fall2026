services:
  web:
    build: .
    container_name: inet-lamp-web
    ports:
      - "80:80"
    volumes:
      - ./www:/var/www/html
      - ./cgi-bin:/usr/lib/cgi-bin
      - ./cgi-src:/usr/src/cgi
    depends_on:
      - db

  db:
    image: mysql:8.4
    container_name: inet-lamp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: inet-lamp-pma
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

  # Node.js server: code lives in ./nodejs
  #   http://localhost:3000  landing page (nodejs/server.js)
  #   http://localhost:3001  whichever example you run with
  #                          docker compose exec node node week04/class1/01_hello_http.js
  #   http://localhost:3002  a second service at the same time (week 6 comments service)
  node:
    image: node:22-alpine
    container_name: inet-node
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_DATABASE: appdb
      MONGO_URL: mongodb://mongo:27017
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    volumes:
      - ./nodejs:/app
      # keep the container's node_modules separate from any you install on Windows
      - node_modules:/app/node_modules
    depends_on:
      - db
      - mongo

  # React front end (week 10 on): code lives in ./react, the dev server is Vite.
  #   http://localhost:5173  the React app, while you run (in your own terminal)
  #                          docker compose exec react npm run dev
  # A separate container from "node" on purpose: the front end and the server are separate
  # programs, and in production they're deployed separately too. The browser only ever talks
  # to 5173; Vite passes /api/... on to the Express server at http://node:3001 (API_TARGET).
  # It mounts ./react only, so nothing in here can read the server's .env files.
  # It starts idle: you run npm inside it, like the node examples.
  react:
    image: node:22-alpine
    container_name: inet-react
    restart: unless-stopped
    init: true
    # Docker creates this folder (react/mflix-react) the first time, empty. In week 10 we
    # scaffold the app into it: docker compose exec react npm create vite@9 . -- --template react
    working_dir: /app/mflix-react
    command: tail -f /dev/null
    environment:
      API_TARGET: http://node:3001
    ports:
      - "5173:5173"
    volumes:
      - ./react:/app
    depends_on:
      - node

  # MongoDB: connect from Compass / VS Code with mongodb://localhost:27017
  # No username or password - local development only.
  mongo:
    image: mongo:8.0
    container_name: inet-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
  mongo_data:
  node_modules:
