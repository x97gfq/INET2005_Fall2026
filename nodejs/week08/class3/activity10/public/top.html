<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top rated (fetch) · mflix-lite</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- LEVEL 4 (given - you write public/top.js and GET /api/top): a plain HTML file - no EJS. The browser asks /api/top for JSON and builds
       the rows itself (client-side rendering, like week 6's page and like React).
       View Source: the table body is EMPTY. Compare with /top, where it's full. -->
  <nav class="navbar navbar-expand bg-dark" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="/movies">mflix-lite</a>
      <div class="navbar-nav me-auto">
        <a class="nav-link" href="/movies">Movies</a>
        <a class="nav-link" href="/top">Top rated</a>
        <a class="nav-link" href="/top.html">Top rated (fetch)</a>
      </div>
    </div>
  </nav>
  <main class="container my-4">
    <h1 class="h3 mb-1">Top rated</h1>
    <p class="text-muted">The same list as /top - built in the browser with fetch().</p>
    <table class="table table-striped">
      <thead><tr><th>#</th><th>Title</th><th>Year</th><th>Genres</th><th>IMDb</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5">Loading...</td></tr></tbody>
    </table>
  </main>
  <script src="top.js"></script>
</body>
</html>
