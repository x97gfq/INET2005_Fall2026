<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Finder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #movies tr { cursor: pointer; }
    #movies tr.table-active { font-weight: 600; }
  </style>
</head>
<body>
  <!--
    The FRONT END of our full-stack app. Plain HTML + JavaScript, running in the browser.
    It never touches MongoDB: everything comes from the back end over HTTP, as JSON.
      Movies   -> this server's API     /api/movies               (port 3001)
      Comments -> a different service   localhost:3002/api/...    (Activity 5)
  -->
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-baseline">
      <h1>Movie Finder</h1>
      <a href="/api-docs" target="_blank">API docs (Swagger)</a>
    </div>

    <form id="search" class="row g-2 mb-3">
      <div class="col-md-5"><input class="form-control" name="title" placeholder="Title contains..."></div>
      <div class="col-md-3">
        <select class="form-select" name="genre">
          <option value="">Any genre</option>
          <option>Action</option><option>Animation</option><option>Comedy</option>
          <option>Documentary</option><option>Drama</option><option>Horror</option>
          <option>Romance</option><option>Sci-Fi</option><option>Thriller</option><option>Western</option>
        </select>
      </div>
      <div class="col-md-2"><input class="form-control" name="year" type="number" placeholder="Year"></div>
      <div class="col-md-2"><button class="btn btn-primary w-100">Search</button></div>
    </form>

    <div class="row">
      <div class="col-lg-7">
        <table class="table table-hover table-sm">
          <thead><tr><th>Title</th><th>Year</th><th>Genres</th><th class="text-end">IMDb</th></tr></thead>
          <tbody id="movies"></tbody>
        </table>
        <div class="d-flex align-items-center gap-2">
          <button id="prev" class="btn btn-outline-secondary btn-sm">&larr; Prev</button>
          <span id="pageInfo" class="text-muted small"></span>
          <button id="next" class="btn btn-outline-secondary btn-sm">Next &rarr;</button>
        </div>
      </div>
      <div class="col-lg-5">
        <div id="details" class="text-muted">Click a movie for details.</div>
        <div id="comments" class="mt-3"></div>
      </div>
    </div>
  </div>

  <!-- The script lives in app.js: the Content-Security-Policy blocks inline scripts -->
  <script src="app.js"></script>
</body>
</html>
