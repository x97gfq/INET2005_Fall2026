# OpenAPI description of the Movies API.
# Swagger UI (http://localhost:3001/api-docs) is generated from this file, and other
# tools (Postman, code generators) can import it. Change a route? Change this too.
openapi: 3.0.3
info:
  title: Movies API (week 7)
  version: 2.0.0
  description: |
    A small microservice over MongoDB's `sample_mflix.movies` collection.
    INET2005 Week 7 - the week 6 API with validation middleware, logging and JWT auth.

    Reading is public. Writing needs a token:
    1. `POST /api/auth/login` with `{ "username": "bob", "password": "letmein" }`
    2. Click **Authorize** (top right), paste the `token`, click Authorize.

    | User | Password | Role | Can |
    |---|---|---|---|
    | alice | password123 | admin | read, create, update, delete |
    | bob | letmein | editor | read, create, update |
    | carol | hunter2 | viewer | read |
servers:
  - url: http://localhost:3001
tags:
  - name: Auth
  - name: Movies

# Reading is public: every operation is open unless it lists `security` itself.

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in - trade a username and password for a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: bob }
                password: { type: string, format: password, example: letmein }
      responses:
        '200':
          description: 'The token. Send it as `Authorization: Bearer <token>`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  tokenType: { type: string, example: Bearer }
                  expiresIn: { type: string, example: 1h }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Wrong username or password (one message for both)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Invalid username or password }
        '429':
          description: 5 failed logins for this username from this IP in 15 minutes. Wait for Retry-After seconds.
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until you can try again }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Too many failed logins. Try again in 15 minutes }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out - this token stops working immediately
      description: The token's id (jti) is stored as revoked until the token would have expired anyway.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Logged out (no body) }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Who does my token say I am?
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The user and role from the token
          content:
            application/json:
              example: { user: bob, role: editor, expires: '2026-10-22T15:00:00.000Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/movies:
    get:
      tags: [Movies]
      summary: List movies (filtered, paginated)
      parameters:
        - { name: title, in: query, schema: { type: string }, description: 'Part of the title, any case', example: matrix }
        - { name: genre, in: query, schema: { type: string }, example: Sci-Fi }
        - { name: year, in: query, schema: { type: integer }, example: 1999 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: One page of matching movies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoviePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Movies]
      summary: Create a movie (editor or admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovieInput' }
      responses:
        '201':
          description: Created. The Location header holds the new movie's URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/movies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The movie's _id (24 hex characters)
        schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
        example: 573a139bf29313caabcf3d23
    get:
      tags: [Movies]
      summary: Get one movie
      responses:
        '200':
          description: The movie, with every stored field
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Movies]
      summary: Replace a movie (editor or admin)
      security: [{ bearerAuth: [] }]
      description: The body becomes the whole movie. Fields you leave out are removed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovieInput' }
      responses:
        '200':
          description: The replaced movie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Movies]
      summary: Update some fields of a movie (editor or admin)
      security: [{ bearerAuth: [] }]
      description: Only the fields you send change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovieUpdate' }
            example: { rated: PG-13, runtime: 140 }
      responses:
        '200':
          description: The updated movie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Movies]
      summary: Delete a movie (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted (no body) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The token from POST /api/auth/login
  schemas:
    MovieUpdate:
      type: object
      properties:
        title: { type: string, maxLength: 200, example: 'INET2005: The Movie' }
        year: { type: integer, minimum: 1870, maximum: 2100, example: 2026 }
        runtime: { type: integer, minimum: 1, description: Minutes, example: 95 }
        genres: { type: array, items: { type: string }, example: [Documentary, Comedy] }
        rated: { type: string, example: PG }
        plot: { type: string, maxLength: 1000, example: Students build an API in an afternoon. }
        directors: { type: array, items: { type: string } }
        cast: { type: array, items: { type: string } }
        imdb:
          type: object
          properties:
            rating: { type: number, minimum: 0, maximum: 10 }
            votes: { type: integer }
        type: { type: string, enum: [movie, series], default: movie }
    MovieInput:
      allOf:
        - $ref: '#/components/schemas/MovieUpdate'
        - type: object
          required: [title]
    Movie:
      allOf:
        - type: object
          properties:
            _id: { type: string, example: 573a139bf29313caabcf3d23 }
        - $ref: '#/components/schemas/MovieUpdate'
    MoviePage:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 23539 }
        totalPages: { type: integer, example: 1177 }
        results:
          type: array
          items: { $ref: '#/components/schemas/Movie' }
    Error:
      type: object
      properties:
        error: { type: string }
        details:
          type: object
          additionalProperties: { type: string }
          description: 'Validation only: one message per field'
  responses:
    BadRequest:
      description: Invalid id, query value or body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Validation failed, details: { title: title is required } }
    Unauthorized:
      description: No token, or it's expired, forged or logged out
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Missing bearer token. POST /api/auth/login to get one }
    Forbidden:
      description: Valid token, but your role isn't allowed to do this
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 'Requires role: admin' }
    NotFound:
      description: No movie with that id
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Movie not found }
